name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "icon.svg"
      - "grok_1795682575120.jpg"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www assets
          cp index.html manifest.webmanifest icon.svg grok_1795682575120.jpg sw.js www/
          cp -r assets/. www/assets/ 2>/dev/null || true

      - name: Prepare native launcher icon
        run: |
          npm install --no-save --no-package-lock sharp @capacitor/assets
          node <<'NODE'
          const sharp = require('sharp');

          (async () => {
            const source = 'grok_1795682575120.jpg';

            await sharp(source)
              .resize(1024, 1024, { fit: 'cover', position: 'centre' })
              .png()
              .toFile('assets/icon-only.png');

            const resized = await sharp(source)
              .resize(680, 680, { fit: 'contain', background: { r: 0, g: 0, b: 0, alpha: 0 } })
              .ensureAlpha()
              .raw()
              .toBuffer({ resolveWithObject: true });

            const pixels = resized.data;
            for (let i = 0; i < pixels.length; i += 4) {
              const brightest = Math.max(pixels[i], pixels[i + 1], pixels[i + 2]);
              pixels[i + 3] = brightest < 55 ? 0 : 255;
            }

            const foreground = await sharp({
              create: {
                width: 1024,
                height: 1024,
                channels: 4,
                background: { r: 0, g: 0, b: 0, alpha: 0 }
              }
            })
              .composite([{
                input: await sharp(pixels, { raw: resized.info }).png().toBuffer(),
                left: 172,
                top: 172
              }])
              .png()
              .toBuffer();

            await Promise.all([
              sharp(foreground).toFile('assets/icon-foreground.png'),
              sharp({
                create: {
                  width: 1024,
                  height: 1024,
                  channels: 4,
                  background: '#0b0c0f'
                }
              }).png().toFile('assets/icon-background.png'),
              sharp(source)
                .resize(1024, 1024, { fit: 'contain', background: '#0b0c0f' })
                .png()
                .toFile('assets/splash.png')
            ]);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Generate Android project and native assets
        run: |
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Redro-Pricing-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
